# B10: B9 Full + Phase 3 joint DIoU×conf score (consolidates reinit gates)
# Замінює окремі conf/DIoU reinit-пороги одним неперервним балом + λ-розкладом.
# Мотивація: DIoU-машинерія коштує лише +0.8% (стаття, табл. 2), тож консолідація
# скорочує гіперпараметри при паритеті/кращому. A/B (scripts/joint_ab.py):
#   worst-10  R3 +0.085 vs B9 (+0.014 без outlier bird-15)
#   easy-10   R3 -0.0007 vs B9 (паритет, у межах шуму)
name: "B10 Joint"
description: "B9 Full + Phase 3 joint DIoU×conf score (arithmetic, thr 0.3, lam 0.3/0.0)"
tracker: "YOLOe-VP-IoU"
experiment_id: "B10"
version: "1.0"

model_path: "yoloe-v8l-seg.pt"
imgsz: 640
device: "cuda"

# ✅ ADAPTIVE CONFIDENCE - оптимізовано
conf: 0.05
conf_max: 0.1
conf_adaptive_rate: 30
iou_threshold: 0.2

# ✅ VPE - оптимізовано
vpe_step: 10
max_vpe: 50
vpe_conf_threshold: 0.05
vpe_conf_max: 0.2
adaptive_rate: 500

max_lost_frames: 15
warmup_frames: 0

# ✅ Phase 2 DIoU - оптимізовано
phase2_diou_threshold: -0.1
phase2_switch_validation_frames: 1
waiting_reinit_conf_threshold: 1.00
waiting_reinit_diou_threshold: -0.5

# ✅ Phase 3 DIoU - оптимізовано
# Примітка: при use_joint_score=true пороги reinit_conf_threshold /
# reinit_diou_threshold / reinit_diou_max короткозамкнені (замінені joint-балом);
# reinit_adaptive_rate перевикористовується як темп спадання λ.
reinit_conf_threshold: 0.3
reinit_diou_threshold: -0.4
reinit_diou_max: -0.9
reinit_adaptive_rate: 25
phase3_redetection_validation_frames: 1
phase3_vpe_freeze_frames: 30
phase3_ref_mode: "last_valid"

# ✅ Phase 1 High Confidence Re-ID - оптимізовано
phase1_high_conf_reid_threshold: 0.9
phase1_high_conf_reid_iou: 0.0
phase1_high_conf_reid_diou: -0.3
phase1_high_conf_reid_require_lost: false
phase1_high_conf_reid_validation_frames: 3
phase1_high_conf_reid_conf_gap: 0.15
phase1_high_conf_reid_validation_skip: 0

# ✅ KALMAN - оптимізовано
use_kalman: true
kalman_process_noise: 0.001
kalman_measurement_noise: 0.01

# ✅ DUAL MEMORY VPE - оптимізовано
use_dual_memory_vpe: true
dual_long_term_capacity: 20
dual_long_term_quality_threshold: 0.6
dual_long_term_weight: 0.5
dual_short_term_capacity: 10
dual_short_term_weight: 0.5
dual_temporal_decay: 0.9
dual_update_long_term_every: 50
dual_replace_worst_lt: true
dual_use_anchor: true
dual_anchor_weight: 0.1

###
phase3_appearance_weight: 0.75
vpe_gate_threshold: 0.75
vpe_gate_ref: aggregated

# ⭐ Phase 3 joint DIoU×conf score (R3, sweep + A/B tuned)
use_joint_score: true
joint_mode: arithmetic          # 'geometric' (AND-подібний) | 'arithmetic' (компенсація)
reinit_joint_threshold: 0.3     # єдиний поріг прийняття замість conf+DIoU порогів
joint_lam_start: 0.3            # вага DIoU-близькості щойно після втрати
joint_lam_min: 0.0             # вага DIoU-близькості після довгої втрати (0 = чистий conf)
reinit_diou_floor: -0.95       # жорсткий anti-teleport floor

verbose: false
debug_frame_step: 10000
