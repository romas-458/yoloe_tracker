# B2: +VPE - додати Visual Prompt Engineering
name: "B2 +VPE"
description: "B-series: VPE only (no Kalman, no DIoU)"
tracker: "YOLOe-VP-IoU"
experiment_id: "B2"
version: "1.0"

model_path: "yoloe-v8s-seg.pt"
imgsz: 640
device: "cuda"

# Детекція - фіксований confidence
conf: 0.01
conf_max: 0.01
conf_adaptive_rate: 999999

# IoU matching
iou_threshold: 0.3

# ✅ VPE УВІМКНЕНО
vpe_step: 10
max_vpe: 50
vpe_conf_threshold: 0.05
vpe_conf_max: 0.05
vpe_conf_adaptive_rate: 999999

max_lost_frames: 15
warmup_frames: 0

# ❌ Phase 2 DIoU ВИМКНЕНО
phase2_diou_threshold: 1.0
waiting_reinit_conf_threshold: 1.0
waiting_reinit_diou_threshold: -0.5

# ❌ Phase 3 reinit ВИМКНЕНО
reinit_conf_threshold: 1.0
reinit_diou_threshold: -1.0
reinit_diou_max: -0.9
reinit_adaptive_rate: 15
phase3_redetection_validation_frames: 0

# ❌ KALMAN ВИМКНЕНО
use_kalman: false

# ❌ DUAL MEMORY ВИМКНЕНО
use_dual_memory_vpe: false

verbose: false
debug_frame_step: 10
