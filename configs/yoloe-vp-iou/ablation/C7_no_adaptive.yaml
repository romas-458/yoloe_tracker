# ============================================================================
# C7 −Adaptive confidence  —  leave-one-out від C0_full
# ============================================================================
# Вимикає ОБИДВІ рампи: conf (conf_adaptive_rate) і VPE-conf (через vpe_conf_max <= vpe_conf_threshold). Складений конфіг — якщо дасть великий ефект, розщепити на дві частини.
#
# Базa: C0_full.yaml (v8m, joint on, floor -0.80; повний LaSOT-280 = 0.5871 @ 41.3 FPS).
# Змінено рівно один компонент — рядки нижче позначені `⬅ C-ABLATION`.
# Прогін: lasot_ablation_subset12.txt. Різниці < 0.04 AUC не значущі (SE≈0.037).
# ============================================================================
name: "C7 −Adaptive confidence"
description: "LOO from C0_full: C7 −Adaptive confidence"
tracker: "YOLOe-VP-IoU"
experiment_id: "C7"
version: "1.0"

model_path: "yoloe-v8m-seg.pt"
imgsz: 640
device: "cuda"

# ✅ ADAPTIVE CONFIDENCE
conf: 0.05
conf_max: 0.1
conf_adaptive_rate: 999999   # ⬅ C-ABLATION
iou_threshold: 0.2

# ✅ VPE
vpe_step: 10
max_vpe: 50
vpe_conf_threshold: 0.05
vpe_conf_max: 0.05   # ⬅ C-ABLATION
vpe_conf_adaptive_rate: 5     # реальний ключ (дефолт трекера); `adaptive_rate` — мертвий
adaptive_rate: 500            # DEAD KEY: залишено лише для сумісності з B-конфігами

max_lost_frames: 15
warmup_frames: 0

# ✅ Phase 2 DIoU
phase2_diou_threshold: -0.1
phase2_switch_validation_frames: 1
waiting_reinit_conf_threshold: 1.00
waiting_reinit_diou_threshold: -0.5

# ✅ Phase 3 DIoU
# При use_joint_score=true пороги reinit_conf_threshold / reinit_diou_threshold /
# reinit_diou_max короткозамкнені (їх замінює joint-бал); reinit_adaptive_rate
# перевикористовується як темп спадання λ.
reinit_conf_threshold: 0.3
reinit_diou_threshold: -0.4
reinit_diou_max: -0.9
reinit_adaptive_rate: 25
phase3_redetection_validation_frames: 1
phase3_vpe_freeze_frames: 30
phase3_ref_mode: "last_valid"

# ✅ Phase 1 High Confidence Re-ID   (вимикається значенням 1.0, НЕ 0.0)
phase1_high_conf_reid_threshold: 0.99
phase1_high_conf_reid_iou: 0.0
phase1_high_conf_reid_diou: -0.3
phase1_high_conf_reid_require_lost: false
phase1_high_conf_reid_validation_frames: 3
phase1_high_conf_reid_conf_gap: 0.15
phase1_high_conf_reid_validation_skip: 0

# ✅ KALMAN
use_kalman: true
kalman_process_noise: 0.001
kalman_measurement_noise: 0.0001

# ✅ DUAL MEMORY VPE
use_dual_memory_vpe: true
dual_long_term_capacity: 20
dual_long_term_quality_threshold: 0.6
dual_long_term_weight: 0.5
dual_short_term_capacity: 10
dual_short_term_weight: 0.5
dual_temporal_decay: 0.9
dual_update_long_term_every: 50
dual_replace_worst_lt: true
dual_use_anchor: true
dual_anchor_weight: 0.1

# ✅ VPE GATE + Phase 3 appearance   (обидва вимикаються значенням 0.0)
phase3_appearance_weight: 0.75
vpe_gate_threshold: 0.75
vpe_gate_ref: aggregated

# ⭐ Joint DIoU×conf score (Phase 3 reinit + Phase 2 re-association)
use_joint_score: true
joint_mode: arithmetic
reinit_joint_threshold: 0.3
joint_lam_start: 0.3
joint_lam_min: 0.0
reinit_diou_floor: -0.8       # anti-teleport / anti-distractor floor (sweet spot на Табл.2)
joint_apply_phase2: true

verbose: false
debug_frame_step: 10000
