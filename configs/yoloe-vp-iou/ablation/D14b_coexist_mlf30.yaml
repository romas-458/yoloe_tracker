# ============================================================================
# D14: D0-minimal + ВИКЛЮЧЕННЯ ЗА СПІВІСНУВАННЯМ (MOT-шар)
# ============================================================================
# Ідея: об'єкт, який довго існує ОДНОЧАСНО з ціллю у роз'єднаній позиції, доведено
# не є ціллю → його бокс неприйнятний для re-detection. Єдиний механізм проєкту,
# що НЕ порівнює зовнішність, тож не успадковує стелю «вигляд не розрізняє
# майже ідентичні екземпляри», об яку розбились усі 7 попередніх осей.
#
# ПЕРЕДІСТОРІЯ ВИМІРУ (scripts/coexist_exclusion_study.py, probe16):
#   • Податок (правило викреслює СПРАВЖНЮ ціль) при штампі з 1 кадру доказу:
#     sepia-13 0.780, deer-4 0.165 — вбило б здорові треки. Причина НЕ стеля
#     вигляду, а перемикання ідентичності у самому tracklet-шарі + вічний штамп:
#     на sepia-13 ОДИН хибний штамп на кадрі 1 отруїв 2116 з 2713 кадрів.
#   • При stamp_min_frames=30: податок 0.000 (oracle clean) на 15/16, umbrella-9
#     0.002. Користь: 69/140 вирішальних подій заблоковано, book-19 = 4/4.
#   ⇒ ПЕРШИЙ механізм із виміряним нульовим податком і ненульовою користю.
#
# ⚠️ Це діагностика, а не AUC. 69/140 ПРОГНОЗУЄ виграш, не доводить: рівно на
#    переході probe16 → 280 вмер D9b (+0.090 → 0, p=0.32).
# ⚠️ coexist_stamp_min_frames=30 узято із запасу book-19 (962 з 991 кадрів
#    роз'єднано), а НЕ свіпом. НЕ свіпати на probe16 — це пастка підгонки, та сама,
#    що й з max_lost_frames=30.
#
# Базa — D0_minimal.yaml без змін; додано лише блок coexist_*.
# ============================================================================
name: "D14b Coexist + mlf30"
description: "D0-minimal + виключення re-detection кандидатів, доведено не-цільових за роз'єднаним співіснуванням."
tracker: "YOLOe-VP-IoU"
experiment_id: "D14"
version: "1.0"

model_path: "yoloe-v8m-seg.pt"
imgsz: 640
device: "cuda"

conf: 0.05
conf_max: 0.1
conf_adaptive_rate: 30
iou_threshold: 0.2

vpe_step: 10
max_vpe: 50
vpe_conf_threshold: 0.05
vpe_conf_max: 0.2
vpe_conf_adaptive_rate: 5

max_lost_frames: 30
warmup_frames: 0

phase2_diou_threshold: -0.1
phase2_switch_validation_frames: 1
waiting_reinit_conf_threshold: 1.00
waiting_reinit_diou_threshold: -0.5

reinit_conf_threshold: 0.3
reinit_diou_threshold: -0.4
reinit_diou_max: -0.9
reinit_adaptive_rate: 25
phase3_redetection_validation_frames: 1
phase3_vpe_freeze_frames: 30
phase3_ref_mode: "last_valid"

phase1_high_conf_reid_threshold: 1.0
use_kalman: false

use_dual_memory_vpe: true
dual_long_term_capacity: 20
dual_long_term_quality_threshold: 0.6
dual_long_term_weight: 0.5
dual_short_term_capacity: 10
dual_short_term_weight: 0.5
dual_temporal_decay: 0.9
dual_update_long_term_every: 50
dual_replace_worst_lt: true
dual_use_anchor: true
dual_anchor_weight: 0.1

phase3_appearance_weight: 0.0
vpe_gate_threshold: 0.0

use_joint_score: true
joint_mode: arithmetic
reinit_joint_threshold: 0.3
joint_lam_start: 0.3
joint_lam_min: 0.0
joint_apply_phase2: true

reinit_diou_floor: -0.7
adaptive_diou_floor: false

# ⭐ ЄДИНА ЗМІНА ПРОТИ D0
use_coexist_exclusion: true
coexist_link_thr: 0.1          # поріг IoU зв'язування tracklet-ів (двобічний: 0.3 рве
                               # tracklet на рухливій кориві, 0.01 плодить сміття)
coexist_max_age: 30            # кадрів без детекції до смерті tracklet
coexist_stamp_min_frames: 30   # кадрів роз'єднаного доказу до штампа «не ціль»

verbose: false
debug_frame_step: 10000
