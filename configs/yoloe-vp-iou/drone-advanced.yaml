# YOLOe-VP-IoU розширена конфігурація для дронів
name: "YOLOe-VP-IoU Drone Advanced"
description: "Розширена конфігурація з реініціалізацією та адаптивною впевненістю"
tracker: "YOLOe-VP-IoU"
created_date: "2026-01-28"
version: "1.0"
tags:
  - "yoloe-vp-iou"
  - "drone"
  - "advanced"
  - "fast-motion"

# Параметри
vpe_step: 10
max_vpe: 50
iou_threshold: 0.2
warmup_frames: 0
phase2_diou_threshold: -0.0
max_lost_frames: 15
conf: 0.01
conf_max: 0.1
conf_adaptive_rate: 30
reinit_conf_threshold: 0.3
waiting_reinit_conf_threshold: 0.4
waiting_reinit_diou_threshold: -0.5
vpe_conf_threshold: 0.05
vpe_conf_max: 0.2
adaptive_rate: 500
use_kalman: false
use_samurai_kalman: true
kalman_alpha_kf: 0.15
kalman_tau_kf: 3
kalman_n_max: 5
kalman_iou_threshold: 0.3
kalman_process_noise: 0.001
kalman_measurement_noise: 0.0001
hybrid_conf_weight: 0.9
reinit_diou_threshold: -0.6
reinit_diou_max: -0.9
reinit_adaptive_rate: 25
use_dual_memory_vpe: true
dual_long_term_capacity: 20
dual_long_term_quality_threshold: 0.6
dual_long_term_weight: 0.5
dual_short_term_capacity: 10
dual_short_term_weight: 0.5
dual_temporal_decay: 0.9
dual_update_long_term_every: 50
dual_replace_worst_lt: true
dual_use_anchor: true
dual_anchor_weight: 0.1
phase3_redetection_validation_frames: 3
verbose: true
debug_frame_step: 10
